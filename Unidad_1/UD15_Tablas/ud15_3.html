<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    
    <title>Document</title>
    <style>
        table {
    border-collapse: collapse;
}
    th, td {
    border: 2px solid black;
    padding: 6px 12px;
    text-align: center;
}
    th {
    background-color: steelblue;
    color: white;
    }
    </style>
</head>
<body>
    <table>
    <caption>Menú de cafetería</caption>
    <tr>
        <th>Producto</th>
        <th>Tamaño</th>
        <th>Precio</th>
    </tr>
    <tr>
        <th colspan="3">Desayunos</th>
    </tr>
    <tr>
        <td rowspan="2">Café</td>
        <td>Pequeño</td>
        <td>1,20 €</td>
    </tr>
    <tr>
        <td>Grande</td>
        <td>1,60 €</td>
    </tr>
    <tr>
        <td>Tostada</td>
        <td>Única</td>
        <td>2,00 €</td>
    </tr>
    <tr>
        <th colspan="3">Bebidas</th>
    </tr>
    <tr>
        <td rowspan="2">Zumo de naranja</td>
        <td>Pequeño</td>
        <td>2,00 €</td>
    </tr>
    <tr>
        <td>Grande</td>
        <td>2,80 €</td>
    </tr>
    </table>
    
</body>
</html>
