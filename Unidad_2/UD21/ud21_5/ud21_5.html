<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de hardware</title>
    <link rel="stylesheet" href="Estilob.css">
</head>
<body>
    <table>
        <caption>Inventario de hardware de redes - 2026</caption>

            <tr>
                <th>Categoria</th>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Precio Unitario</th>
                <th>Notas / Descuento</th>
            </tr>
        </thead>
        <tbody><!--filas-->
            <tr>
                <td rowspan="2" class="categoria">Seguridad</td>
                <td>Firewall Hardware</td>
                <td>2</td>
                <td>450</td>
                <td>Urgente</td>
            </tr>
            <tr>
                <td>Llave USB Cifrada</td>
                <td>10</td>
                <td>35</td>
                <td></td>
            </tr>
            <tr>
                <td class="categoria">Redes</td>
                <td>Switch Gestionable 24p</td>
                <td>5</td>
                <td>150</td>
                <td>40%</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
