<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de alta de usuario</title>
    <link rel="stylesheet" href="estilo.css">                  <!-- enlaza la hoja de estilos externa -->
</head>
<body>
    <h1>Formulario de alta de usuario</h1>

    <!-- action="#": no se envía a ningún sitio | method="post": datos ocultos | enctype: necesario para enviar archivos -->
    <form action="#" method="post" enctype="multipart/form-data">
        <table>

            <!-- Fila 1: identificador, ocupa las 2 columnas -->
            <tr>
                <td colspan="2" class="centrado">
                    <label for="identificador">Identificador de nuevo usuario</label>
                    <!-- value: texto por defecto | readonly: se ve pero no se puede cambiar -->
                    <input type="text" name="identificador" id="identificador" value="usu_012345" readonly title="Identificador asignado automáticamente">
                </td>
            </tr>

            <!-- Fila 2: nombre y apellidos -->
            <tr>
                <td>
                    <label for="nombre">Nombre:</label>
                    <!-- required: obligatorio, no deja enviar si está vacío -->
                    <input type="text" name="nombre" id="nombre" required title="Escribe tu nombre">
                </td>
                <td>
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" name="apellidos" id="apellidos" title="Escribe tus apellidos">
                </td>
            </tr>

            <!-- Fila 3: contraseñas. type="password" oculta lo que se escribe -->
            <tr>
                <td>
                    <label for="contrasena">Contraseña:</label>
                    <input type="password" name="contrasena" id="contrasena" required title="Escribe una contraseña">
                </td>
                <td>
                    <label for="confirmar">Confirmar contraseña:</label>
                    <input type="password" name="confirmar" id="confirmar" title="Repite la contraseña">
                </td>
            </tr>

            <!-- Fila 4: email. type="email" comprueba que tenga forma de correo -->
            <tr>
                <td colspan="2">
                    <label for="email">Email:</label>
                    <input type="email" name="email" id="email" size="60" required title="Escribe tu correo electrónico">
                </td>
            </tr>

            <!-- Fila 5: sexo. Mismo name = solo se puede elegir uno. El label va DETRÁS del input (para :checked + label) -->
            <tr>
                <td><label>Sexo:</label></td>
                <td>
                    <input type="radio" name="sexo" id="hombre" value="hombre" title="Hombre">
                    <label for="hombre">Hombre</label>
                    <!-- checked: marcado por defecto -->
                    <input type="radio" name="sexo" id="mujer" value="mujer" checked title="Mujer">
                    <label for="mujer">Mujer</label>
                </td>
            </tr>

            <!-- Fila 6: aficiones. Checkbox = se pueden marcar varias. Label DETRÁS del input -->
            <tr>
                <td><label>Aficiones:</label></td>
                <td>
                    <input type="checkbox" name="aficiones" id="deportes" value="deportes" title="Deportes">
                    <label for="deportes">Deportes</label><br>
                    <input type="checkbox" name="aficiones" id="lectura" value="lectura" checked title="Lectura">
                    <label for="lectura">Lectura</label><br>
                    <input type="checkbox" name="aficiones" id="cine" value="cine" title="Cine">
                    <label for="cine">Cine</label>
                </td>
            </tr>

            <!-- Fila 7: país. select = desplegable | selected: opción por defecto -->
            <tr>
                <td><label for="pais">País:</label></td>
                <td>
                    <select name="pais" id="pais" title="Selecciona tu país">
                        <option value="espana" selected>España</option>
                        <option value="francia">Francia</option>
                        <option value="portugal">Portugal</option>
                    </select>
                </td>
            </tr>

            <!-- Fila 8: foto. type="file" = selector de archivos | accept: solo imágenes -->
            <tr>
                <td><label for="foto">Subir su foto:</label></td>
                <td>
                    <input type="file" name="foto" id="foto" accept="image/*" title="Sube una foto tuya">
                </td>
            </tr>

            <!-- Fila 9: comentarios. cols = ancho, rows = alto | placeholder: pista en gris -->
            <tr>
                <td><label for="comentarios">Comentarios personales:</label></td>
                <td>
                    <textarea name="comentarios" id="comentarios" cols="40" rows="5" placeholder="Escriba aquí sus comentarios" title="Escribe lo que quieras contarnos"></textarea>
                </td>
            </tr>

            <!-- Fila 10 (NUEVA): código promocional. disabled: no se puede usar ni se envía -->
            <tr>
                <td><label for="promo">Código promocional:</label></td>
                <td>
                    <input type="text" name="promo" id="promo" disabled title="No disponible por ahora">
                </td>
            </tr>

            <!-- Fila 11: botones. reset = vuelve a los valores iniciales | submit = envía -->
            <tr>
                <td class="centrado">
                    <input type="reset" value="Resetear" title="Vuelve a los valores iniciales">
                </td>
                <td class="centrado">
                    <input type="submit" value="Enviar" title="Envía el formulario">
                </td>
            </tr>

        </table>
    </form>
</body>
</html>
